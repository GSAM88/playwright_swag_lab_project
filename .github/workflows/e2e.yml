name: E2E Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 5' # Every Friday at 11:00 PM UTC
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
      VISUAL_USERNAME: ${{ secrets.VISUAL_USERNAME }}
      PROBLEM_USERNAME: ${{ secrets.PROBLEM_USERNAME }}
      PERFORMANCE_GLITCH_USERNAME: ${{ secrets.PERFORMANCE_GLITCH_USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --user 1001
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run E2E tests
      run: npx playwright test tests/ --grep @e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
